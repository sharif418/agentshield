version: '3.8'

services:
  agentshield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentshield-dashboard
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./../db/custom.db
      - AGENTSHIELD_API_KEY=${AGENTSHIELD_API_KEY:-}
      - NODE_ENV=production
    volumes:
      - agentshield-db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  websocket:
    build:
      context: ./mini-services/approval-ws
      dockerfile: Dockerfile
    container_name: agentshield-websocket
    ports:
      - "3003:3003"
    environment:
      - WS_PORT=3003
    restart: unless-stopped
    depends_on:
      agentshield:
        condition: service_healthy

volumes:
  agentshield-db:
    driver: local
