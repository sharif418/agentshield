version: "3.8"

services:
  agentshield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentshield-dashboard
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./db/agentshield.db
      - AGENTSHIELD_API_KEY=agentshield-demo-key
      - NODE_ENV=production
    volumes:
      - agentshield-data:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/stats", "-H", "x-api-key: agentshield-demo-key"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # WebSocket service for real-time notifications
  agentshield-ws:
    build:
      context: ./mini-services/approval-ws
      dockerfile: Dockerfile
    container_name: agentshield-websocket
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
    restart: unless-stopped

volumes:
  agentshield-data:
    driver: local
